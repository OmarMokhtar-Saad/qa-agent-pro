  ul.tlapi li::before{content:"→";position:absolute;left:0;color:var(--accent)}
  details.tltext > summary{cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:7px}
  details.tltext > summary:hover{color:var(--accent)}
  details.tltext pre{margin:6px 0 0;padding:9px 11px;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--code-line);border-radius:5px;
    font-family:"IBM Plex Mono",monospace;font-size:.77rem;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow-y:auto}

  .llmrow .exhead{cursor:default}
  .llmrow.noans .exhead{opacity:.85}
  .v-llm{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .v-none{color:var(--gap);border-color:var(--gap);background:var(--gap-soft)}
  .toks{margin-left:auto;display:inline-flex;align-items:baseline;gap:4px;flex:none;font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink);font-variant-numeric:tabular-nums}
  .toks i{font-style:normal;font-size:.68rem;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
  ul.tlist2{list-style:none;margin:0;padding:0;display:grid;gap:4px}
  li.trow{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:6px;border:1px solid var(--line-soft);background:var(--panel-2)}
  li.trow.tidle{opacity:.72}
  li.trow.tused{border-left:3px solid var(--accent)}
  .tname{font-family:"IBM Plex Mono",monospace;font-size:.79rem;font-weight:600;color:var(--ink);flex:1;min-width:0;overflow-wrap:anywhere}
  .twrite{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--defect);background:var(--defect-soft);border:1px solid var(--defect);padding:1px 7px;border-radius:99px;flex:none}
  .tn{font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);flex:none}
  .tkind{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);flex:none}
  .tcap{font-family:"IBM Plex Mono",monospace;font-size:.74rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);padding:2px 9px;border-radius:99px;flex:none}
  .cpath{flex:1;min-width:0;overflow-wrap:anywhere}
  .crep{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--gap);background:var(--gap-soft);border:1px solid var(--gap);padding:1px 7px;border-radius:99px;flex:none}
  .cdur{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none}

  ul.caplist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
  li.caprow{display:flex;align-items:baseline;gap:9px;padding:7px 11px;border-radius:6px;border:1px solid var(--line-soft);background:var(--panel-2);flex-wrap:wrap}
  li.caprow.capused{border-left:3px solid var(--accent);background:var(--accent-soft)}
  .capid{font-family:"IBM Plex Mono",monospace;font-size:.78rem;font-weight:700;color:var(--ink);flex:none}
  li.caprow.capused .capid{color:var(--accent)}
  /* THE CAPABILITY TEXT IS ARABIC on this track -- it is lifted from the prompt the
     model was given. It inherited the exchange summary's monospace face, which carries
     no Arabic, so every line fell back to a face that does not shape or join: the
     letters stood apart, spaced by the mono metrics, and read as broken. The Arabic
     stack is the same one the phone preview and the `sara` rows use, so one script is
     drawn one way across the page. `dir="auto"` on the element does the rest: the
     sentences mix Arabic with Latin identifiers and bare parentheses, and without a
     direction the bidi algorithm has to guess from the paragraph it sits in. */
  .capdesc{font-size:.9rem;line-height:1.75;color:var(--ink-2);flex:1 1 100%;
    min-width:0;font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
    overflow-wrap:anywhere;
    /* ONE LINE, CLAMPED -- not sliced. A character cut of Arabic lands mid-word and
       strands a joined letter; the clamp ends the line wherever the line ends and the
       full string is still in the DOM for find and for copy. */
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  /* Open, the body carries the text -- so the preview would be its first line, twice.
     That duplicate is what made the fold look pointless. */
  details.caprow[open] > summary .capdesc{display:none}
  li.caprow.capused .capdesc{color:var(--ink)}
  details.caprow > summary{flex-wrap:wrap;padding:8px 11px}
  details.caprow{background:var(--panel-2)}
  details.caprow.capused{border-left:3px solid var(--accent)}
  details.caprow.capused .capid{color:var(--accent)}
  .capfull{margin:0;font-size:.88rem;line-height:1.7;color:var(--ink);max-width:none;font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
  .askd{color:var(--ink-3);font-size:.74rem}
  .v-prompt{color:var(--code-lit);border-color:var(--code-lit);background:var(--panel)}
  details.ex.noans{border-color:var(--gap)}
  details.ex.noans > summary{background:var(--gap-soft)}

  /* ── exchanges ────────────────────────────────────────────────────────── */
  .apis{margin-top:20px}
  .exlist{display:grid;gap:6px}
  details.ex,.ex.flat{border:1px solid var(--line);border-radius:7px;
    background:var(--panel-2);overflow:hidden;transition:border-color .14s ease}
  /* INSIDE A SEQUENCE the card frame is noise: the row is already a row, and a border
     around every model call turned the stream into a stack of boxes. The frame comes
     back the moment the exchange is opened, where it is doing real work -- holding two
     panes together. Outside a sequence (the API tables) nothing changes. */
  .seqmain>details.ex,.seqmain>.ex.flat{border-color:transparent;background:transparent;
    border-radius:5px}
  .seqmain>details.ex>summary,.seqmain>.ex.flat .exhead{padding:2px 6px 2px 0;gap:9px}
  /* THE VERB IS THIS ROW'S KIND PILL, so it has to sit in the same column as one. The
     chevron is pulled into the gutter to its left rather than pushing it right, or the
     exchange rows start ~18px in from every other row and the column stops being one. */
  .seqmain>details.ex>summary>.chev{margin-left:-15px}
  .seqmain>details.ex>summary .verb,.seqmain>.ex.flat .exhead .verb{min-width:74px;
    text-align:center}
  /* THE PATH IDENTIFIES THE ENDPOINT; the host does not. It is the same host on every
     row of a run, and spelling it out wrapped a one-line row onto three. Where a run
     actually spans hosts, the API surface section reports them per call. */
  .seqmain .exhost{display:none}
  .seqmain>details.ex:hover{border-color:var(--line)}
  .seqmain>details.ex[open]{border-color:var(--line);background:var(--panel-2)}
  details.ex:hover{border-color:var(--panel-3)}
  details.ex[open]{border-color:var(--accent);background:var(--panel-2)}
  details.ex[open] .exbody{background:var(--panel);border-radius:0 0 6px 6px}
  details.ex > summary,.ex.flat .exhead{cursor:pointer;padding:11px 13px;display:flex;gap:11px;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:.8rem}
  .ex.flat .exhead{cursor:default;opacity:.7}
  details.ex > summary:hover{background:var(--panel-3)}
  details.ex[open] > summary{border-bottom:1px solid var(--line);background:var(--panel-2)}
  .chev{flex:none;width:0;height:0;border-left:5px solid var(--ink-3);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .16s ease,border-left-color .16s ease}
  details.ex[open] > summary > .chev{transform:rotate(90deg);border-left-color:var(--accent)}
  .chev.ghost{visibility:hidden}
  .verb{font-weight:700;flex:none;letter-spacing:.05em;font-size:.74rem;padding:3px 7px;border-radius:5px;background:var(--panel);border:1px solid var(--line)}
  .v-get{color:var(--req);border-color:var(--req);background:var(--panel)}
  .v-post{color:var(--pass);border-color:var(--pass);background:var(--pass-soft)}
  .v-put,.v-patch{color:var(--gap);border-color:var(--gap);background:var(--gap-soft)}
  .v-delete{color:var(--defect);border-color:var(--defect);background:var(--defect-soft)}
  .v-render{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .path{color:var(--ink-2);overflow-wrap:anywhere;flex:1;min-width:0}
  details.ex[open] > summary .path{color:var(--ink)}
  .badge{flex:none;font-weight:700;font-size:.74rem;padding:3px 9px;border-radius:99px;font-family:"IBM Plex Mono",monospace;letter-spacing:.02em}
  .badge.ok{background:var(--pass-soft);color:var(--pass)}
  .badge.bad{background:var(--defect-soft);color:var(--defect)}
  /* Neither pass nor defect: the capture never said. Same pair the `p-gap`
     pill uses, so "not captured" reads the same wherever it appears. */
  .badge.gap{background:var(--gap-soft);color:var(--gap)}
  .badge.sm{font-size:.68rem;padding:2px 7px}
  .mt{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;font-weight:600;font-style:normal;padding:2px 8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line-soft);line-height:1.4}
  .exbody{padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:18px}
  .exbody.solo{grid-template-columns:minmax(0,1fr)}
  .pane{min-width:0;display:grid;gap:12px;align-content:start;padding:12px;border:1px solid var(--line-soft);border-radius:7px;background:var(--panel-2)}
  .phead{font-family:"IBM Plex Mono",monospace;font-size:.73rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink);font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dot.req{background:var(--req)}
  .dot.res{background:var(--pass)}
  .sec,.secbody,.tabwrap,.pane > *{min-width:0;max-width:100%}
  .sec{display:block}
  .sec h5,details.sec>summary{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:8px;margin:0 0 6px}
  details.sec>summary{cursor:pointer;padding:3px 0;border-radius:3px;transition:color .12s ease}
  details.sec>summary:hover{color:var(--accent)}
  details.sec[open]>summary .chev{transform:rotate(90deg);border-left-color:var(--accent)}
  details.sec:not([open])>summary{margin-bottom:0}
  .secbody{min-width:0}
  .sec.empty h5{margin:0}

  .tabwrap{border:1px solid var(--line);border-radius:6px;overflow-x:auto;overflow-y:visible;background:var(--cell-val)}
  table.htab{width:100%;border-collapse:collapse;table-layout:fixed;margin:0}
  table.htab td{padding:8px 11px;border-bottom:1px solid var(--line-soft);font-family:"IBM Plex Mono",monospace;font-size:.78rem;overflow-wrap:anywhere;word-break:break-word;vertical-align:top;line-height:1.55}
  table.htab tr:last-child td{border-bottom:none}
  td.hk{color:var(--ink-2);width:34%;background:var(--cell-key);font-weight:500;border-right:1px solid var(--line)}
  td.hv{color:var(--ink);background:var(--cell-val);white-space:pre-wrap;overflow-wrap:anywhere}
  td.hv.blank{color:var(--ink-3);font-style:italic}
  table.htab tr:hover td{background:var(--panel-3)}
  tr.hl td.hk{color:var(--accent);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
  tr.hl td.hv{color:var(--ink);font-weight:600}

  /* ── code ─────────────────────────────────────────────────────────────── */
  .code{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--code-line);min-width:0;max-width:100%;background:var(--code-bg)}
  .codetag{position:absolute;top:0;right:0;font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.14em;color:var(--ink-2);background:var(--code-bar);padding:3px 9px;border-radius:0 0 0 6px;border-left:1px solid var(--code-line);border-bottom:1px solid var(--code-line);z-index:1;font-weight:600}
  /* THE PROMPT AND RESPONSE PANES, WHICH ARE MOSTLY ARABIC. Two things were wrong here, and
     both are about the same text: what the model was actually sent.

     THE FACE. This said `"IBM Plex Mono",monospace` alone. IBM Plex Mono ships no Arabic
     coverage, so every Arabic character in a prompt fell out of the stack to whatever the
     browser happened to have -- which is why the report's own transcripts read well (they use
     Plex Sans Arabic, see .seqtx) and the prompt behind them did not. Plex Sans Arabic is
     already loaded by the stylesheet link at the top of this file; it was simply never reached
     from here. Mono stays FIRST so Latin, digits, braces and the JSON structure keep their
     monospace alignment, and only the glyphs Mono cannot draw fall through to the Arabic face.

     THE DIRECTION. The pane carries dir="auto", which resolves ONE direction for the whole
     block from its first strong character -- so a prompt whose first line is Arabic flipped
     every English line in it too, and a prompt that opened in English left its Arabic lines
     running the wrong way. `unicode-bidi:plaintext` is the rule this content wants: it applies
     the dir="auto" heuristic PER LINE, so each line of a mixed-language prompt takes the
     direction of its own first strong character. `text-align:start` then puts an Arabic line
     against the right edge and an English one against the left, which is what makes the
     difference legible rather than merely correct. */
  .code pre{margin:0;padding:13px 14px;background:var(--code-bg);color:var(--code-ink);font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace;font-size:.79rem;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-height:320px;overflow-y:auto;unicode-bidi:plaintext;text-align:start}
  /* A highlighted JSON string value is Arabic inside an LTR structure, so it is ISOLATED and
     never flipped: the Arabic run reads right-to-left within its own line while the quotes,
     colon and braces around it stay where the JSON put them. This is deliberately consistent
     with codebox pinning JSON to dir="ltr" -- a first-strong-Arabic value would otherwise take
     the punctuation with it -- rather than fighting that decision. */
  .code .js,.code .jk{unicode-bidi:isolate}
  .code .jk{color:var(--code-key);font-weight:600}
  .code .jp{color:var(--ink-3)}
  .code .js{color:var(--code-str)}
  .code .jn{color:var(--code-num)}
  .code .jb{color:var(--code-lit);font-weight:600}
  .clip{background:var(--code-bar);color:var(--ink-2);font-family:"IBM Plex Mono",monospace;font-size:.68rem;padding:6px 13px;border-top:1px solid var(--code-line);letter-spacing:.06em}

  .empty-note{margin:0;font-family:"IBM Plex Mono",monospace;font-size:.77rem;color:var(--ink-2);font-style:italic;padding:10px 12px;border:1px dashed var(--line);border-radius:6px}
  ul.flatapi{margin:0;padding:0;list-style:none;display:grid;gap:5px}
  ul.flatapi li{font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--ink);overflow-wrap:anywhere;padding:5px 9px;background:var(--panel-2);border-radius:5px}
  .hint{font-size:.85rem;color:var(--ink-2);font-style:italic;margin:9px 0 0}
  .cerr{margin:14px 0 0;padding:11px 13px;background:var(--defect-soft);border:1px solid var(--defect);border-radius:6px;font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--defect);white-space:pre-wrap;overflow-x:auto}

  /* ── series tokens ────────────────────────────────────────────────────── */
  /* Four hues for the stacked figures, NEVER a status colour: a segment that happened to be
     the defect red would read as a failure, and these are durations, not verdicts. */
  .sw.ser-1{background:var(--ser-1)}.sw.ser-2{background:var(--ser-2)}
  .sw.ser-3{background:var(--ser-3)}.sw.ser-4{background:var(--ser-4)}

  /* ── run facts strip ──────────────────────────────────────────────────── */
  /* The six things a reader asks before any number -- which device, which build, which
     backend, which model, when, and whether the driver was fit to type -- as one strip under
     the masthead. They were spread over the masthead meta, a session block two screens down
     and a trust list below that, and the answer to "which env was this" was in the third. */
  .runstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-top:22px;
    border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
  .rf{padding:10px 14px 11px;border-right:1px solid var(--line-soft);display:grid;gap:3px;min-width:0;align-content:start}
  .rf:last-child{border-right:none}
  .rfl{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .rfv{font-size:.84rem;color:var(--ink);font-weight:500;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.35}
  .rfv small{font-size:.7rem;color:var(--ink-3);font-weight:400;flex-basis:100%}
  .rfv .sw{width:8px;height:8px}
  @media (max-width:760px){.rf{border-right:none;border-bottom:1px solid var(--line-soft)}.rf:last-child{border-bottom:none}}

  /* ── outcome panel ────────────────────────────────────────────────────── */
  /* The case count and the outcome bar are ONE figure. They were a hero tile, two more tiles
     and a bar with a legend -- the same two numbers four times, before the reader reached
     anything they did not already know. */
  .outcome{display:grid;grid-template-columns:minmax(200px,1fr) minmax(0,2.2fr);gap:12px;margin-top:8px}
  .outcome .kpi.hero{grid-column:auto}
  .outcome figure.seg{display:flex;flex-direction:column;justify-content:center;margin:0}
  @media (max-width:760px){.outcome{grid-template-columns:1fr}}
  .kpi .kd a{color:var(--accent)}

  /* ── scope strip ──────────────────────────────────────────────────────── */
  /* What the fence let through, as numbers with names; the sentence that used to carry all
     nine of them in one breath is folded beneath, in full, for the reader who needs it. */
  .scope{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow);padding:12px 16px 10px}
  .scope-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px 18px}
  .scope .sk{display:block;font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .scope .sv{font-size:.98rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
  .scope .sv small{font-weight:400;color:var(--ink-3);font-size:.74rem;margin-left:4px}
  .scope details{margin-top:8px}
  .scope details>summary{cursor:pointer;list-style:none;display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--accent);border-bottom:1px dotted var(--accent)}
  .scope details>summary::-webkit-details-marker{display:none}
  .scope details>summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .scope details ul.flatapi{margin-top:8px}
  .scope details ul.flatapi li{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:.84rem;line-height:1.55}

  /* A card the user saw is one click from the case it was on. */
  table.cov td.caselinks a{font-family:"IBM Plex Mono",monospace;font-size:.8rem;font-weight:600;text-decoration:none;
    border:1px solid var(--line);border-radius:5px;padding:2px 8px;margin-right:4px;background:var(--panel-2)}
  table.cov td.caselinks a:hover{border-color:var(--accent);background:var(--accent-soft)}

  /* ── the reading guide, folded ────────────────────────────────────────── */
  /* Doctrine, not data: it is the same text on every run, so it opens on request instead of
     standing between the heading and the first number. */
  details.note.fold{padding:0}
  details.note.fold>summary{cursor:pointer;list-style:none;padding:14px 20px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  details.note.fold>summary::-webkit-details-marker{display:none}
  details.note.fold>summary h3{margin:0}
  details.note.fold>summary .mt{font-size:.8rem;color:var(--ink-3)}
  details.note.fold>summary:hover h3{color:var(--accent)}
  details.note.fold>.notebody{padding:0 20px 18px}

  /* ── stacked figure ───────────────────────────────────────────────────── */
  /* One bar per row, split into the phases that made up its total. Same row shape as
     `.runs` so the two figures read as siblings; the track is a flex row of segments. */
  .budget{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .budget li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;padding:7px 9px 9px;border-radius:6px}
  .budget li>button{all:unset;display:contents;cursor:pointer}
  .budget li:hover{background:var(--panel-2)}
  .budget li:focus-within{outline:2px solid var(--focus);outline-offset:-2px}
  .btrack{grid-column:1/-1;display:flex;gap:2px;height:14px;border-radius:3px;overflow:hidden;background:var(--panel-2)}
  .btrack i{display:block;height:100%;min-width:0}
  .btrack .ser-1{background:var(--ser-1)}.btrack .ser-2{background:var(--ser-2)}
  .btrack .ser-3{background:var(--ser-3)}.btrack .ser-4{background:var(--ser-4)}

  /* The scan line's token pair: in and out on one pill, because they are one measurement. */
  .m.tok b+i{margin-right:6px}
  .m.tok i:last-child{margin-right:0}

  /* ── case card: what the collapsed card says ──────────────────────────── */
  /* The tester recognises a case by what was typed and what came back, not by the use-case
     title -- four cards titled "Book in-person appointment" are told apart by the utterance.
     One line: the first utterance, an arrow, the last reply, each clipped to one line. */
  .csnip{font-size:.82rem;color:var(--ink-2);line-height:1.35;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;margin-top:3px;min-width:0}
  .csnip q{quotes:"\00ab" "\00bb";font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;color:var(--ink);
    unicode-bidi:isolate;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(40ch,100%)}
  .csnip q.sara{color:var(--ink-2)}
  .csnip .arr{color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:.7rem;flex:none}
  /* An open card can be several screens long; its summary stays in view so the reader
     always knows which case they are inside and can close it from where they are. */
  details.case[open]>summary{position:sticky;top:calc(var(--bar-h) + var(--toolbar-h));z-index:5}

  /* ── the verdict strip: why this case passed or failed, before any evidence ── */
  .vstrip{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 14px;padding:10px 13px;
    border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  .vstrip.v-fail{border-color:var(--defect)}
  .vstrip.v-pass{border-color:var(--pass)}
  .vstrip .vwhy{font-size:.86rem;color:var(--ink);overflow-wrap:anywhere;min-width:0}
  .vstrip .vwhy b{font-weight:600}
  .vstrip.v-fail .vwhy b{color:var(--defect)}
  .vstrip a{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:.72rem;white-space:nowrap}

  /* ── the turns table: one row per utterance, with the driver's clocks ─────── */
  table.cov.turns{min-width:760px;font-size:.86rem}
  table.cov.turns tbody tr{cursor:default}
  table.cov.turns tbody tr:hover td{background:transparent}
  table.cov.turns td.n{font-family:"IBM Plex Mono",monospace;font-weight:700;color:var(--accent);width:36px}
  table.cov.turns td.said{max-width:36ch}
  table.cov.turns td.said q{quotes:"\00ab" "\00bb";font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;unicode-bidi:isolate}
  table.cov.turns td.said small{display:block;color:var(--ink-3);font-size:.72rem;font-style:italic;margin-top:2px}
  table.cov.turns td.num{white-space:nowrap}
  table.cov.turns .btrack{height:10px;min-width:150px}
  table.cov.turns td.outc{white-space:nowrap}

  /* ── lanes: filter a run sequence by what kind of thing happened ──────────── */
  .seqlanes{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:0 0 8px}
  .seqlanes .fgl{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-right:2px}
  .seqlanes .chip{padding:3px 9px;font-size:.7rem}
  .seqlanes .chip[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
  li.seq.lane-off{display:none}

  /* ── prev / next at the foot of an open card ──────────────────────────────── */
  .casenav{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:12px;border-top:1px solid var(--line-soft)}
  .casenav a.chip{text-decoration:none}
  .casenav .spacer{flex:1}

  /* ── footer / utilities ───────────────────────────────────────────────── */
  footer{margin-top:72px;padding-top:22px;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink-3);line-height:1.8}
  .totop{
    position:fixed;right:18px;bottom:18px;z-index:55;width:40px;height:40px;border-radius:50%;
    background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-lift);cursor:pointer;
    display:grid;place-items:center;color:var(--ink-2);opacity:0;pointer-events:none;transform:translateY(8px);
    transition:opacity .18s ease,transform .18s ease;
  }
  .totop.show{opacity:1;pointer-events:auto;transform:none}
  .totop:hover{color:var(--accent);border-color:var(--accent)}
  .totop svg{width:16px;height:16px}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }
  @media print{
    .appbar,.toolbar,.totop,.plink,.goto{display:none!important}
    body{background:#fff;color:#000}
    .wrap{padding:0;max-width:none}
    details.case{break-inside:avoid;box-shadow:none;content-visibility:visible}
    .kpi,figure.seg,.tablewrap,.note{box-shadow:none}
  }

  /* ── the wireframe: element bounds drawn to scale inside the phone ───────
     This lane takes no screenshot, by design. What it holds for every screen is
     the pruned element list -- text, ids and rectangles -- so the phone shows those
     rectangles at their true proportions. A frame is 360x800 CSS px, fixed, so two
     screens can be compared by eye; the phone around it is widened to hold it. */
  .phone.wire{max-width:400px}
  .phone.wire .ph-scroll{padding:10px 12px 12px;max-height:none;overflow:visible}
  .frame{position:relative;width:360px;height:800px;margin:0 auto;background:var(--ph-surface);
    border:1px solid var(--ph-border);border-radius:14px;overflow:hidden}
  .frame.missing{display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .frame .rect{position:absolute;border:1px solid var(--ph-divider);border-radius:3px;font-size:9px;
    line-height:1.1;overflow:hidden;padding:1px 2px;color:var(--ph-text);
    font-family:"IBM Plex Sans Arabic","IBM Plex Sans",-apple-system,sans-serif}
  .frame .rect.tap{border-color:var(--ph-accent);background:var(--ph-accent-soft)}
  .frame .rect.edit{border-color:var(--ph-info);background:var(--ph-info-fill)}
  .frame .wirenote{color:var(--ph-muted);font-size:.82rem;font-style:italic;margin:0;max-width:24ch}
  .wirelegend{display:flex;gap:4px 14px;flex-wrap:wrap;margin:10px 0 0;justify-content:center;
    font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--ink-3)}
  .wirelegend li{display:flex;align-items:center;gap:6px;list-style:none}
  .wirelegend i.sw{border:1px solid var(--line);background:transparent}
  .wirelegend i.sw.tap{border-color:var(--ph-accent);background:var(--ph-accent-soft)}
  .wirelegend i.sw.edit{border-color:var(--ph-info);background:var(--ph-info-fill)}
  .wirelegend ul{display:contents;margin:0;padding:0}
  .ph-top .ph-brand b{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.78rem}
</style>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  /* ── theme ───────────────────────────────────────────────────────────────
     Three states: Light/Dark stamp data-theme on the root and win over everything; Auto
     removes the stamp and hands the decision back to prefers-color-scheme. */
  (function () {
    var KEY = 'sara-audit-theme';
    var root = document.documentElement;
    var btns = $$('.themeswitch button');
    function apply(mode) {
      if (mode === 'light' || mode === 'dark') {
        root.setAttribute('data-theme', mode); root.style.colorScheme = mode;
      } else {
        root.removeAttribute('data-theme'); root.style.colorScheme = 'light dark';
      }
      btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.themeSet === mode)); });
    }
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved) {
      apply(saved);
    } else {
      // No preference of our own yet: keep whatever the host stamped on the root (the
      // Artifact viewer sets data-theme) and only light up the matching button.
      var host = root.getAttribute('data-theme');
      var mode = (host === 'light' || host === 'dark') ? host : 'system';
      btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.themeSet === mode)); });
    }
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        apply(b.dataset.themeSet);
        try { localStorage.setItem(KEY, b.dataset.themeSet); } catch (e) {}
      });
    });
  })();

  /* ── case explorer ─────────────────────────────────────────────────────── */
  var list = $('#caselist');
  var cases = list ? $$('details.case', list) : [];
  cases.forEach(function (d, i) { d.dataset.i = i; });

  /* Filter groups are DISCOVERED from the chips, not hard-coded: 'area' is the single-select
     one, 'flags' matches against a space-separated list, and every other data-group becomes a
     multi-select set matched against the card's matching data-<group> attribute. A report adds
     a filter by emitting chips for it. */
  var state = { q: '', area: '*', usecase: '', flags: {} };
  var multi = ['flags'];
  $$('.chip[data-group]').forEach(function (b) {
    var g = b.dataset.group;
    if (g === 'area' || state[g]) return;
    state[g] = {}; multi.push(g);
  });

  function words(q) { return q.toLowerCase().split(/\s+/).filter(Boolean); }
  function anyOn(set) { for (var k in set) if (set[k]) return true; return false; }

  function matches(d) {
    var ds = d.dataset;
    if (state.area !== '*' && ds.area !== state.area) return false;
    if (state.usecase && ds.usecase !== state.usecase) return false;
    for (var gi = 0; gi < multi.length; gi++) {
      var g = multi[gi];
      if (!anyOn(state[g])) continue;
      if (g === 'flags') {
        var have = ' ' + (ds.flags || '') + ' ';
        for (var f in state.flags) if (state.flags[f] && have.indexOf(' ' + f + ' ') === -1) return false;
      } else if (!state[g][ds[g] || 'NONE']) {
        return false;
      }
    }
    if (state.q) {
      var hay = ds.search || '';
      var ws = words(state.q);
      for (var i = 0; i < ws.length; i++) if (hay.indexOf(ws[i]) === -1) return false;
    }
    return true;
  }

  var shownEl = $('#shown'), noRes = $('#noresults'), clearBtn = $('#clear'), ucChip = $('#active-uc');
  var qIn = $('#q'), qX = $('#qx'), qT;
  function isFiltered() {
    return !!(state.q || state.area !== '*' || state.usecase || anyOn(state.cov) || anyOn(state.verdict) || anyOn(state.diff) || anyOn(state.flags));
  }
  function render() {
    var n = 0;
    cases.forEach(function (d) { var ok = matches(d); d.hidden = !ok; if (ok) n++; });
    if (shownEl) shownEl.textContent = n;
    if (noRes) noRes.hidden = n !== 0;
    if (clearBtn) clearBtn.hidden = !isFiltered();
    if (fbtn && fcount) { var fn = countActive(); fcount.textContent = fn; fbtn.classList.toggle('on', fn > 0); }
    if (ucChip) { ucChip.hidden = !state.usecase; var t = $('b', ucChip); if (t) t.textContent = state.usecase; }
    $$('.chip[data-group]').forEach(function (b) {
      var g = b.dataset.group, v = b.dataset.v, on;
      if (g === 'area') on = state.area === v; else on = !!state[g][v];
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
  }

  function clearAll(keepQ) {
    state.area = '*'; state.usecase = ''; multi.forEach(function (g) { state[g] = {}; });
    if (!keepQ) { state.q = ''; if (qIn) qIn.value = ''; if (qX) qX.hidden = true; }
    render();
  }

  $$('.chip[data-group]').forEach(function (b) {
    b.addEventListener('click', function () {
      var g = b.dataset.group, v = b.dataset.v;
      if (g === 'area') state.area = v; else state[g][v] = !state[g][v];
      render();
    });
  });
  $$('[data-clear]').forEach(function (b) { b.addEventListener('click', function () { clearAll(false); }); });
  if (ucChip) $('button', ucChip).addEventListener('click', function () { state.usecase = ''; render(); });

  /* search — every word must appear somewhere in the case's text */
  if (qIn) {
    qIn.addEventListener('input', function () {
      clearTimeout(qT);
      qT = setTimeout(function () { state.q = qIn.value.trim(); if (qX) qX.hidden = !state.q; render(); }, 120);
    });
    qIn.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { qIn.value = ''; state.q = ''; if (qX) qX.hidden = true; render(); } });
    if (qX) qX.addEventListener('click', function () { qIn.value = ''; state.q = ''; qX.hidden = true; render(); qIn.focus(); });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) {
        ev.preventDefault(); qIn.focus(); qIn.select();
      }
    });
  }

  /* sort — reorders the DOM; 77 nodes is nothing */
  var sortSel = $('#sort');
  function num(d, k) { var v = parseFloat(d.dataset[k]); return isNaN(v) ? -1 : v; }
  if (sortSel) sortSel.addEventListener('change', function () {
    var k = sortSel.value;
    var sorted = cases.slice().sort(function (a, b) {
      if (k === 'order') return a.dataset.i - b.dataset.i;
      var av = num(a, k), bv = num(b, k);
      return bv - av || (a.dataset.i - b.dataset.i);
    });
    sorted.forEach(function (d) { list.appendChild(d); });
  });

  /* expand / collapse what is shown */
  function setAll(open) {
    cases.forEach(function (d) {
      if (d.hidden) return;
      d.open = open;
      if (!open) $$('details.ex, details.sec, details.seqfold', d).forEach(function (x) { x.open = false; });
    });
  }
  var ea = $('#expand-all'), ca = $('#collapse-all');
  if (ea) ea.addEventListener('click', function () { setAll(true); });
  if (ca) ca.addEventListener('click', function () { setAll(false); });

  /* permalinks: copy, stamp the hash, never toggle the card */
  $$('.plink').forEach(function (a) {
    a.addEventListener('click', function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      var href = location.href.split('#')[0] + a.getAttribute('href');
      try { history.replaceState(null, '', a.getAttribute('href')); } catch (e) {}
      var done = function () { a.classList.add('done'); a.textContent = '✓'; setTimeout(function () { a.classList.remove('done'); a.textContent = '#'; }, 1400); };
      try { navigator.clipboard.writeText(href).then(done, done); } catch (e) { done(); }
    });
  });


  /* -- hydrating the evidence -------------------------------------------------
     A big body -- a system prompt, a JSON request -- is not written into its pane. It is
     parked once per page in a <script type="text/plain"> island and pulled in the first
     time the pane around it is opened. The reason is duplication: six distinct prompt
     texts were being written out 94 times, and the page went past the 16 MiB artifact
     ceiling saying the same six things.

     The text stays in the page SOURCE, so a grep or a diff of two runs still finds it.
     What it is not in, until opened, is the live DOM -- so every such pane carries an
     "open to view" line, and printing hydrates the lot first. */
  function esc(t) {
    /* Exactly Python's html.escape(quote=True), so an opened pane is byte-for-byte
       what an inline one would have been -- the pin in report_selfcheck.py compares
       the two on a body carrying every character the two escapers disagree on. */
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
  }
  /* The same four token rules as _hl_json in tools/report_shell.py -- an opened pane must
     be indistinguishable from one that was small enough to be written inline. */
  var JTOK = /("(?:\\.|[^"\\])*")\s*:|("(?:\\.|[^"\\])*")|(-?\d+\.?\d*(?:[eE][+-]?\d+)?)|\b(true|false|null)\b/g;
  function hlJson(t) {
    var out = '', last = 0, m;
    JTOK.lastIndex = 0;
    while ((m = JTOK.exec(t)) !== null) {
      out += esc(t.slice(last, m.index));
      if (m[1]) out += '<span class="jk">' + esc(m[1]) + '</span><span class="jp">:</span>';
      else if (m[2]) out += '<span class="js">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="jn">' + esc(m[3]) + '</span>';
      else out += '<span class="jb">' + esc(m[4]) + '</span>';
      last = m.index + m[0].length;
    }
    return out + esc(t.slice(last));
  }
  function hydrate(root) {
    $$('pre[data-store]', root).forEach(function (pre) {
      var isl = document.getElementById(pre.getAttribute('data-store'));
      if (!isl) return;                       /* an island that is not there stays empty
                                                 rather than printing a guess */
      var txt = isl.textContent.replace(/<\\\//g, '</');
      if (pre.getAttribute('data-hl') === 'json') pre.innerHTML = hlJson(txt);
      else pre.textContent = txt;
      pre.removeAttribute('data-store');
      var note = pre.parentNode && pre.parentNode.querySelector('.clip.lazy');
      if (note) note.parentNode.removeChild(note);
    });
  }
  /* `toggle` does not bubble; a capturing listener still sees it. */
  document.addEventListener('toggle', function (ev) {
    var t = ev.target;
    if (t && t.tagName === 'DETAILS' && t.open) {
      hydrate(t);
      if (t.classList.contains('case')) { lanes(t); casenav(t); }
    }
  }, true);
  window.addEventListener('beforeprint', function () { hydrate(document); });

  /* -- lanes: filter a run sequence by what kind of thing happened -------------
     A sequence is a log, and a log with a hundred rows needs a way to see only the model
     calls, or only the endpoints. The groups are read off the row kinds present in THIS
     sequence, so a chip never offers a lane the case has no rows in. Rows of a kind no
     group claims stay visible whatever is toggled. */
  var LANES = [
    ['model', ['prompt', 'llm']],
    ['endpoints & tools', ['api', 'net', 'auth', 'call', 'done', 'event']],
    ['flow & cards', ['flow', 'step', 'cap', 'card']],
    ['driver & screen', ['user', 'sara', 'tap', 'turn', 'want', 'start', 'note', 'log', 'agent', 'app', 'voice']]
  ];
  function lanes(card) {
    $$('ul.seqlist', card).forEach(function (ul) {
      var prev = ul.previousElementSibling;
      if (prev && prev.classList.contains('seqlanes')) return;
      var rows = $$('li.seq', ul);
      if (rows.length < 8) return;
      var bar = document.createElement('div'); bar.className = 'seqlanes';
      var lab = document.createElement('span'); lab.className = 'fgl'; lab.textContent = 'Show'; bar.appendChild(lab);
      LANES.forEach(function (L) {
        var mine = rows.filter(function (li) {
          return L[1].some(function (k) { return li.classList.contains('is-' + k); });
        });
        if (!mine.length) return;
        var b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
        b.setAttribute('aria-pressed', 'true');
        b.appendChild(document.createTextNode(L[0]));
        var n = document.createElement('i'); n.textContent = mine.length; b.appendChild(n);
        b.addEventListener('click', function () {
          var on = b.getAttribute('aria-pressed') !== 'true';
          b.setAttribute('aria-pressed', String(on));
          mine.forEach(function (li) { li.classList.toggle('lane-off', !on); });
        });
        bar.appendChild(b);
      });
      if (bar.children.length > 1) ul.parentNode.insertBefore(bar, ul);
    });
  }

  /* -- prev / next: move between cards without scrolling back to the list --------
     Rebuilt on every open, because the list order and the filter both change. */
  function casenav(card) {
    var old = $('.casenav', card); if (old) old.remove();
    var body = $('.cbody', card); if (!body) return;
    var vis = cases.filter(function (d) { return !d.hidden; });
    var i = vis.indexOf(card);
    var nav = document.createElement('div'); nav.className = 'casenav';
    var mk = function (d, before) {
      var a = document.createElement('a'); a.className = 'chip'; a.href = '#' + d.id;
      var id = $('.cid', d) ? $('.cid', d).textContent : d.id;
      a.textContent = before ? '\u2190 case ' + id : 'case ' + id + ' \u2192';
      a.addEventListener('click', function (ev) {
        ev.preventDefault(); card.open = false; d.open = true; landOn(d);
      });
      return a;
    };
    if (i > 0) nav.appendChild(mk(vis[i - 1], true));
    var sp = document.createElement('span'); sp.className = 'spacer'; nav.appendChild(sp);
    var c = document.createElement('button'); c.type = 'button'; c.className = 'chip ghost';
    c.textContent = 'Collapse this case';
    c.addEventListener('click', function () { card.open = false; landOn(card); });
    nav.appendChild(c);
    var sp2 = document.createElement('span'); sp2.className = 'spacer'; nav.appendChild(sp2);
    if (i >= 0 && i < vis.length - 1) nav.appendChild(mk(vis[i + 1], false));
    body.appendChild(nav);
  }

  /* -- programmatic scrolling ---------------------------------------------------
     html{scroll-behavior:smooth} is for the reader's own scrolling. When the PAGE moves
     itself -- a deep link, a legend jump -- the animated travel is a second of watching
     dozens of cards go past, so it is suppressed for that one call. */
  function jumpNow(fn) {
    var h = document.documentElement;
    h.classList.add('nosmooth');
    try { fn(); } finally {
      requestAnimationFrame(function () { h.classList.remove('nosmooth'); });
    }
  }

  /* deep link: #case-<id> opens that case even when a filter hides it */
  function openHash() {
    var m = /^#case-(.+)$/.exec(location.hash);
    if (!m) return;
    var d = document.getElementById('case-' + m[1]);
    if (!d) return;
    if (d.hidden) clearAll(false);
    d.open = true;
    $$('details.case.target').forEach(function (x) { x.classList.remove('target'); });
    d.classList.add('target');
    jumpNow(function () { d.scrollIntoView({ block: 'start' }); });
  }
  window.addEventListener('hashchange', openHash);

  /* -- landing on a section ------------------------------------------------------
     The case cards are `content-visibility:auto`, so at the moment a link is followed
     the browser has laid out an estimate of the run, not the run. It scrolls to where
     the anchor is THEN, resolves the real heights, and leaves the reader somewhere
     else -- following the nav to Cases landed a thousand pixels above it. So a jump to
     a section is made by hand and then checked again on the next two frames, once the
     layout below it has settled. */
  function landOn(el) {
    if (!el) return;
    jumpNow(function () { el.scrollIntoView({ block: 'start' }); });
    var tries = 0;
    (function settle() {
      if (tries++ > 6) return;
      requestAnimationFrame(function () {
        var top = el.getBoundingClientRect().top;
        var want = parseFloat(getComputedStyle(el).scrollMarginTop) || 0;
        if (Math.abs(top - want) > 2) {
          jumpNow(function () { el.scrollIntoView({ block: 'start' }); });
        }
        settle();
      });
    })();
  }
  $$('.sectnav a[href^="#"]').forEach(function (a) {
    a.addEventListener('click', function (ev) {
      var el = document.getElementById(a.getAttribute('href').slice(1));
      if (!el) return;                          /* a nav item for a section this page does
                                                   not render keeps the browser's own
                                                   behaviour rather than swallowing it */
      ev.preventDefault();
      if (history.replaceState) history.replaceState(null, '', a.getAttribute('href'));
      landOn(el);
    });
  });
  /* The same correction for a section anchor the page was OPENED on. */
  window.addEventListener('load', function () {
    if (/^#case-/.test(location.hash)) return;  /* openHash owns those */
    var el = location.hash && document.getElementById(location.hash.slice(1));
    if (el) landOn(el);
  });

  /* -- one control for a section's folds -----------------------------------------
     Added where the tiles are, not in the generators: whether a section has enough of
     them to be worth a single control is a question about the rendered page. */
  $$('section').forEach(function (sec) {
    var folds = $$('details.kwhy', sec);
    if (folds.length < 3) return;
    var head = $('.sechead', sec);
    if (!head) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'kwhy-all';
    var sync = function () {
      var open = folds.filter(function (d) { return d.open; }).length;
      b.textContent = open === folds.length ? 'hide the explanations'
                                            : 'explain these figures';
      b.setAttribute('aria-expanded', open === folds.length ? 'true' : 'false');
    };
    b.addEventListener('click', function () {
      var openAll = folds.some(function (d) { return !d.open; });
      folds.forEach(function (d) { d.open = openAll; });
      sync();
    });
    folds.forEach(function (d) { d.addEventListener('toggle', sync); });
    sync();
    head.appendChild(b);
  });

  /* legend, tiles and coverage-table rows are entry points into the explorer */
  function jumpTo(fn) {
    clearAll(true); fn(); render();
    var t = $('#cases');
    if (t) jumpNow(function () { t.scrollIntoView({ block: 'start' }); });
  }
  function setEach(group, values) {
    /* A jump can name a group whose chips this page does not render — the audit's tiles link
       to verdicts that only exist once the run has been graded. Create the set rather than
       throwing on it: the filter then simply matches nothing, which is the honest result. */
    if (!state[group]) { state[group] = {}; multi.push(group); }
    values.split(' ').forEach(function (v) { if (v) state[group][v] = true; });
  }
  $$('[data-jump-cov]').forEach(function (b) {
    b.addEventListener('click', function () { jumpTo(function () { setEach('cov', b.dataset.jumpCov); }); });
  });
  $$('[data-jump-verdict]').forEach(function (b) {
    b.addEventListener('click', function () { jumpTo(function () { setEach('verdict', b.dataset.jumpVerdict); }); });
  });
  $$('[data-jump-diff]').forEach(function (b) {
    b.addEventListener('click', function () { jumpTo(function () { setEach('diff', b.dataset.jumpDiff); }); });
  });
  $$('[data-jump-flag]').forEach(function (b) {
    b.addEventListener('click', function () { jumpTo(function () { setEach('flags', b.dataset.jumpFlag); }); });
  });
  /* The generic form, for a group the shell has never heard of: data-jump-group + data-jump-value. */
  $$('[data-jump-group]').forEach(function (b) {
    b.addEventListener('click', function () {
      var g = b.dataset.jumpGroup;
      jumpTo(function () { setEach(g, b.dataset.jumpValue || ''); });
    });
  });
  $$('[data-jump-case]').forEach(function (b) {
    b.addEventListener('click', function () { location.hash = '#case-' + b.dataset.jumpCase; openHash(); });
  });
  $$('#covtable tbody tr[data-usecase]').forEach(function (tr) {
    var go = function () { jumpTo(function () { state.usecase = tr.dataset.usecase; }); };
    tr.addEventListener('click', go);
    tr.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } });
  });

  /* sortable tables: the coverage matrix, and anything else that opts in with
     class="sortable". One implementation -- a second sorted table with its own quirks is
     how two tables on one page end up disagreeing about what "descending" means. */
  $$('#covtable, table.sortable').forEach(function (tbl) {
  $$('th[data-sort]', tbl).forEach(function (th) {
    th.addEventListener('click', function () {
      var k = th.dataset.sort, dir = th.getAttribute('aria-sort') === 'descending' ? 'ascending' : 'descending';
      $$('th', tbl).forEach(function (t) { t.removeAttribute('aria-sort'); });
      th.setAttribute('aria-sort', dir);
      var body = $('tbody', tbl), rows = $$('tr', body);
      rows.sort(function (a, b) {
        var av = a.dataset['s' + k], bv = b.dataset['s' + k];
        var an = parseFloat(av), bn = parseFloat(bv), r;
        if (!isNaN(an) && !isNaN(bn)) r = an - bn; else r = String(av).localeCompare(String(bv));
        return dir === 'ascending' ? r : -r;
      });
      rows.forEach(function (r) { body.appendChild(r); });
    });
  });
  });

  /* a table row that opens the case it describes */
  $$('tr.jumpable[data-jump-case]').forEach(function (tr) {
    var go = function () { location.hash = '#case-' + tr.dataset.jumpCase; openHash(); };
    tr.addEventListener('click', go);
    tr.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); }
    });
  });

  /* condensed toolbar: sentinel marks the resting spot; past it, fold the chip groups */
  var toolbar = $('#toolbar'), fbtn = $('#fbtn'), fcount = $('#fcount');
  function countActive() {
    var n = 0;
    if (state.q) n++;
    if (state.area !== '*') n++;
    if (state.usecase) n++;
    multi.forEach(function (g) { for (var k in state[g]) if (state[g][k]) n++; });
    return n;
  }
  if (toolbar && 'IntersectionObserver' in window) {
    var sent = document.createElement('div');
    toolbar.parentNode.insertBefore(sent, toolbar);
    new IntersectionObserver(function (en) {
      var stuck = !en[0].isIntersecting;
      toolbar.classList.toggle('stuck', stuck);
      if (!stuck) {
        toolbar.classList.remove('filters-open');
        if (fbtn) fbtn.setAttribute('aria-expanded', 'false');
      }
    }, { rootMargin: '-55px 0px 0px 0px' }).observe(sent);
  }
  if (fbtn) fbtn.addEventListener('click', function () {
    var open = toolbar.classList.toggle('filters-open');
    fbtn.setAttribute('aria-expanded', String(open));
  });

  /* section nav highlight + back to top */
  var navs = $$('.sectnav a');
  if ('IntersectionObserver' in window && navs.length) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        navs.forEach(function (a) { a.classList.toggle('on', a.dataset.nav === en.target.id); });
      });
    }, { rootMargin: '-30% 0px -60% 0px' });
    navs.forEach(function (a) { var s = document.getElementById(a.dataset.nav || ''); if (s) io.observe(s); });
  }
  var top = $('#totop');
  if (top) {
    var tick = false;
    window.addEventListener('scroll', function () {
      if (tick) return; tick = true;
      requestAnimationFrame(function () { top.classList.toggle('show', window.scrollY > 600); tick = false; });
    }, { passive: true });
    top.addEventListener('click', function () { window.scrollTo({ top: 0 }); });
  }

  render();
  openHash();
})();
</script>
