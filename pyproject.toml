[project]
name = "qa-agent-pro"
version = "1.156.0"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "pyyaml>=6.0,<7",  # contracts + OpenAPI specs are YAML (api_test agent)
    "fastmcp>=2.0,<4",
    "mcp>=1.24,<2.0",
    "py-machineid>=0.6,<2",
    "posthog>=7.29,<8",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
    "python-dotenv>=1.0,<2",
    "xlsxwriter>=3.1,<4",
    "cryptography>=41.0,<51",
    "pillow>=10.0,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "respx>=0.21",
    "ruff>=0.15,<0.16",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]
browser = [
    "playwright>=1.40",
]
spec = [
    "pypdf>=4.0",
    "python-docx>=1.1",
]
mobile-fast = [
    "uiautomator2",
]
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "tools*", "config*", "handlers*"]
