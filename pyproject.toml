[project]
name = "qa-agent-pro"
version = "1.7.0"
requires-python = ">=3.10"
dependencies = [
    # The product surface is the MCP stdio server (mcp_server.py + fastmcp).
    "fastmcp>=2.0",
    # Telemetry runtime (tools/telemetry.py): anonymous machine id + PostHog
    # SDK error grouping. Both degrade gracefully and never raise.
    "py-machineid>=0.6",
    "posthog>=7.29",
    "anthropic>=0.25",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langsmith>=0.1",
    "xlsxwriter>=3.1",
    # Ed25519 release-signature verification in tools/updater.py (auto-update
    # trust root). Widely wheeled; the dist build pins it too via patch_pyproject.
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "respx>=0.21",
    "ruff>=0.4",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "langgraph-cli>=0.1",
]
browser = [
    "playwright>=1.40",
]
spec = [
    "pypdf>=4.0",
    "python-docx>=1.1",
]
embeddings = [
    # Optional local embedding backend (QA_EMBEDDINGS_BACKEND=local). Imported
    # lazily by tools/embeddings.py; absent by default so the disabled path and
    # the dist build stay dependency-identical.
    "sentence-transformers>=2.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "tools*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Pydantic models named Test* (TestCase, TestSuite, ...) are not test classes.
python_classes = ["Test*Case", "*Tests", "*TestCase"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
markers = [
    "eval: end-to-end eval-harness tests that run real generation against goldens (needs QA_LLM_BACKEND=api + ANTHROPIC_API_KEY; not run by the default `pytest tests/` gate)",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
