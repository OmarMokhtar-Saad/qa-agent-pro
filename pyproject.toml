[project]
name = "qa-agent-pro"
version = "1.61.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",  # contracts + OpenAPI specs are YAML (api_test agent)
    # The product surface is the MCP stdio server (mcp_server.py + fastmcp).
    "fastmcp>=2.0",
    # mcp_server.py does `from mcp.types import ContentBlock`, so mcp is a DIRECT
    # dependency, not merely fastmcp's. The floor mirrors fastmcp's own bound
    # (mcp<2.0,>=1.24.0); ContentBlock is present in 1.24.0 (verified).
    "mcp>=1.24,<2.0",
    # Telemetry runtime (tools/telemetry.py): anonymous machine id + PostHog
    # SDK error grouping. Both degrade gracefully and never raise.
    "py-machineid>=0.6",
    "posthog>=7.29",
    "anthropic>=0.25",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "xlsxwriter>=3.1",
    # Ed25519 release-signature verification in tools/updater.py (auto-update
    # trust root). Widely wheeled; the dist build pins it too via patch_pyproject.
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "respx>=0.21",
    "ruff>=0.4",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]
browser = [
    "playwright>=1.40",
]
spec = [
    "pypdf>=4.0",
    "python-docx>=1.1",
]
embeddings = [
    # Optional local embedding backend (QA_EMBEDDINGS_BACKEND=local). Imported
    # lazily by tools/embeddings.py; absent by default so the disabled path and
    # the dist build stay dependency-identical.
    "sentence-transformers>=2.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "tools*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Pydantic models named Test* (TestCase, TestSuite, ...) are not test classes.
python_classes = ["Test*Case", "*Tests", "*TestCase"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
# No custom markers. The `eval` marker lived here until 2026-08-15, when
# dead-code deletion Phase 2 (Decision A) deleted evals/ and the nightly CI job
# that was its only user.

[tool.ruff]
target-version = "py310"
# `.claude/` is agent harness and per-session scratch -- ops configs, build_ops_*
# scripts, mutation probes and replay harnesses. It is NOT product code and is
# never shipped (scripts/build_dist.py copies a whitelist and excludes .claude
# outright), so it is not this project's code to keep formatted.
#
# It was ALSO never gated in practice: every session verifies with
# `ruff check tools/ agents/ config/ tests/ mcp_server.py llm.py scripts/`, which
# passes, while CI runs the repo-wide `ruff check .` / `ruff format --check .`
# (.github/workflows/ci.yml:38 and :41). Those two disagreed, so CI was red on
# main while every local check was green: 104 lint findings and 49 unformatted
# files at 4208e90, ALL of them under .claude/. Measured across commits, the
# format step was green at 75d2635 and broke at 688e870 when the finding
# programme began committing harness scripts; the check step had been red since
# well before that.
#
# 56 of the 104 findings are F821 (undefined name) in deliberately partial
# fragments, so formatting could not have fixed them -- the scope was the bug,
# not the formatting. Excluding here makes the repo-wide command mean exactly
# what the scoped one already meant, so CI now gates the product and nothing else.
# `.tmp/` is scratch from live validation runs -- the SHYJ-9311 generation
# scripts and their outputs. Kept on disk as run evidence, never shipped, and
# not this project's code to keep formatted. It is gitignored as well, but that
# alone does NOT stop ruff: ruff walks an untracked directory regardless, which
# is exactly how `ruff check .` -- the gate CLAUDE.md documents -- went red for
# everyone the moment those artifacts appeared.
extend-exclude = [".claude", ".tmp"]

# mypy had NO configuration at all, so `mypy .` -- the lint_cmd the pre-push
# hook runs -- walked into the ops executor's own backups/ directories, found
# two copies of every module and died on duplicate module names before checking
# a single line of product code. These are the same trees ruff excludes, plus
# the backup dirs, which are generated output and never imported.
[tool.mypy]
exclude = "^(backups/|\\.claude/|\\.tmp/|\\.worktrees/|build/|dist/)"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
